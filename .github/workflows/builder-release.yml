# PS5 Longshot Plus Builder: the AppImage (Linux) and the portable Windows folder, built and attached to a release when one is
# published. Nothing here has or makes game content: the kit is what the title is made of besides the game, and players
# add their own game on their own PC.
#
#   kit            ps5/builder/build_kit.sh: RADV, FFmpeg, the SDK, the runtime and the renderer for the console (no game)
#   package        ps5/builder/package.py: both systems' packages, on Linux (the Windows one is cross-built)
#   check-*        each package started on its own system: the builder's parts checked, the window opened (pipeline.py --check)
#   publish        the two files and their SHA-256 attached to the release; only when both checks passed
#
# "Run workflow" (workflow_dispatch) does everything but publish, and keeps the packages as the run's artifacts.
name: Builder release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The version the packages are named with
        default: test
        required: true

permissions:
  contents: read

concurrency:
  group: builder-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  BUILDER_VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  kit:
    name: The kit (no game)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: The packages the build needs
        run: sudo bash ps5/builder/build_kit.sh --install-packages
      - name: What an earlier run fetched and built
        uses: actions/cache@v5
        with:
          path: |
            .local/projects
            .local/ps5-deps
            ps5/deps/PS5_Vulkan/.deps
          key: kit-deps-v3-${{ hashFiles('ps5/builder/build_kit.sh', 'ps5/tools/build-ffmpeg.sh', 'ps5/tools/build-zstd.sh', '.gitmodules', 'ps5/deps/PS5_Vulkan') }}-${{ github.sha }}
          restore-keys: |
            kit-deps-v3-${{ hashFiles('ps5/builder/build_kit.sh', 'ps5/tools/build-ffmpeg.sh', 'ps5/tools/build-zstd.sh', '.gitmodules', 'ps5/deps/PS5_Vulkan') }}-
      - name: Build the kit
        run: bash ps5/builder/build_kit.sh
      - name: The logs, when it failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: kit-logs
          path: work/build-kit
      - name: Pack the kit
        run: tar -C dist -cf kit.tar kit
      - uses: actions/upload-artifact@v5
        with:
          name: kit
          path: kit.tar
          retention-days: 3
          compression-level: 6

  package-linux-x64:
    name: The Linux AppImage (Linux x64)
    needs: kit
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v5
        with:
          name: kit
      - name: Unpack the kit
        run: mkdir -p dist && tar -C dist -xf kit.tar && rm kit.tar
      - name: What the packaging needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libxcb-cursor0 xz-utils
      - name: Build Linux x64 AppImage
        run: python3 -I ps5/builder/package.py --system linux-x64
      - uses: actions/upload-artifact@v5
        with:
          name: builder-linux-x64
          path: |
            dist/builder/*-linux-x64.AppImage
            dist/builder/*-linux-x64.AppImage.sha256
          compression-level: 0

  package-windows-x64:
    name: The Windows Portable Folder (Windows x64)
    needs: kit
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v5
        with:
          name: kit
      - name: Unpack the kit
        run: mkdir -p dist && tar -C dist -xf kit.tar && rm kit.tar
      - name: What the packaging needs
        run: sudo apt-get update && sudo-get install -y --no-install-recommends g++ xz-utils || sudo apt-get install -y --no-install-recommends g++ xz-utils
      - name: Build Windows x64 ZIP
        run: python3 -I ps5/builder/package.py --system windows-x64
      - uses: actions/upload-artifact@v5
        with:
          name: builder-windows-x64
          path: |
            dist/builder/*-windows-x64.zip
            dist/builder/*-windows-x64.zip.sha256
          compression-level: 0

  package-macos:
    name: The macOS App Bundles (Apple Silicon & Intel, separate ZIPs)
    needs: kit
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v5
        with:
          name: kit
      - name: Unpack the kit
        run: mkdir -p dist && tar -C dist -xf kit.tar && rm kit.tar
      - name: Build & Verify macOS Apple Silicon (arm64)
        run: |
          python3 -I ps5/builder/package.py --system macos-arm64
          (cd dist/builder && shasum -a 256 -c *-macos-arm64.zip.sha256)
          mkdir -p /tmp/mac-arm64
          ditto -x -k dist/builder/*-macos-arm64.zip /tmp/mac-arm64
          /tmp/mac-arm64/PS5LongshotPlusBuilder-AppleSilicon.app/Contents/MacOS/PS5LongshotPlusBuilder --cli --check
          QT_QPA_PLATFORM=offscreen /tmp/mac-arm64/PS5LongshotPlusBuilder-AppleSilicon.app/Contents/MacOS/python/bin/python3 -I -u /tmp/mac-arm64/PS5LongshotPlusBuilder-AppleSilicon.app/Contents/MacOS/app/app.py --self-test
      - uses: actions/upload-artifact@v5
        with:
          name: builder-macos-arm64
          path: |
            dist/builder/*-macos-arm64.zip
            dist/builder/*-macos-arm64.zip.sha256
          compression-level: 0
      - name: Build & Verify macOS Intel (x64)
        run: |
          python3 -I ps5/builder/package.py --system macos-x64
          (cd dist/builder && shasum -a 256 -c *-macos-x64.zip.sha256)
          mkdir -p /tmp/mac-x64
          ditto -x -k dist/builder/*-macos-x64.zip /tmp/mac-x64
          test -d /tmp/mac-x64/PS5LongshotPlusBuilder-Intel.app/Contents/MacOS
      - uses: actions/upload-artifact@v5
        with:
          name: builder-macos-x64
          path: |
            dist/builder/*-macos-x64.zip
            dist/builder/*-macos-x64.zip.sha256
          compression-level: 0

  publish:
    name: Attach them to the release
    if: github.event_name == 'release'
    needs: [package-linux-x64, package-windows-x64, package-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: builder-*
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" *.AppImage *.AppImage.sha256 *.zip *.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
